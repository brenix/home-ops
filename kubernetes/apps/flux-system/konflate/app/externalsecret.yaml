---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-webhook-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: konflate-webhook-token-secret
    template:
      data:
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
        KONFLATE_APP_CLIENT_ID: "{{ .GITHUB_BOT_APP_CLIENT_ID }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
        KONFLATE_APP_INSTALLATION_ID: "{{ .GITHUB_BOT_APP_ID }}"
  data:
    - secretKey: &konflateWebhookSecret KONFLATE_WEBHOOK_SECRET
      remoteRef:
        key: *konflateWebhookSecret
    - secretKey: &botClientID GITHUB_BOT_APP_CLIENT_ID
      remoteRef:
        key: *botClientID
    - secretKey: &botAppID GITHUB_BOT_APP_ID
      remoteRef:
        key: *botAppID
    - secretKey: &botPrivateKey GITHUB_BOT_APP_PRIVATE_KEY
      remoteRef:
        key: *botPrivateKey

