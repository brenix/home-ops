---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cloudflare-tunnel-secret
    template:
      data:
        api-token: "{{ .CLOUDFLARE_TUNNEL_TOKEN }}"
  data:
  - secretKey: &key CLOUDFLARE_TUNNEL_TOKEN
    remoteRef:
      key: *key
