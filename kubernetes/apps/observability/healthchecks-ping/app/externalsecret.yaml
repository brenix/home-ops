---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-ping
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: healthchecks-ping
    template:
      data:
        url: "{{ .HEALTHCHECKS_IO_URL }}"
  data:
    - secretKey: &key HEALTHCHECKS_IO_URL
      remoteRef:
        key: *key

