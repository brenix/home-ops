---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime
spec:
  chartRef:
    kind: OCIRepository
    name: uptime-kuma
  interval: 1h
  values:
    controllers:
      uptime-kuma:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/louislam/uptime-kuma
              tag: 2.3.2@sha256:dbede95c52962acf5dedc67b46d98fe9ad366c708aebc5e0ee70ca5245181482
            env:
              PUID: 1000
              PGID: 1000
              TZ: "America/Los_Angeles"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
        strategy: Recreate
    service:
      app:
        externalTrafficPolicy: Local
        ports:
          http:
            port: 3001
        type: LoadBalancer
    route:
      app:
        hostnames:
        - "uptime.brenix.com"
        parentRefs:
        - name: envoy-external
          namespace: network
    persistence:
      data:
        enabled: true
        globalMounts:
        - path: /app/data
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
