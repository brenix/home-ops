---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime
spec:
  chartRef:
    kind: OCIRepository
    name: uptime-kuma
  interval: 1h
  values:
    controllers:
      uptime-kuma:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/louislam/uptime-kuma
              tag: 2.2.1@sha256:778e39605da5fc7cbdfbf76dd0749e680afc117d9cb0a96da3b14644aeb50d18
            env:
              TZ: "America/Los_Angeles"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        strategy: Recreate
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        externalTrafficPolicy: Local
        ports:
          http:
            port: 3001
        type: LoadBalancer
    route:
      app:
        hostnames:
        - "uptime.brenix.com"
        parentRefs:
        - name: envoy-external
          namespace: network
    persistence:
      data:
        enabled: true
        globalMounts:
        - path: /app/data
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
