---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ping-exporter
spec:
  chart:
    spec:
      chart: ping-exporter
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: ping-exporter
      interval: 15m
  releaseName: podinfo
  interval: 1h
  values:
    config:
      targets:
      - 8.8.8.8
      dns:
        nameserver: 192.168.1.1
      ping:
        interval: 30s
        timeout: 3s
    serviceMonitor:
      enabled: true
    testConnection:
      enabled: false

