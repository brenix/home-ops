---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: cloudflare
    template:
      data:
        api-token: "{{ .CLOUDFLARE_API_TOKEN }}"
  data:
  - secretKey: &token CLOUDFLARE_API_TOKEN
    remoteRef:
      key: *token
