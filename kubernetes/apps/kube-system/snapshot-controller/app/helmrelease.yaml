---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chart:
    spec:
      chart: snapshot-controller
      version: 4.2.0
      sourceRef:
        kind: HelmRepository
        name: snapshot-controller
      interval: 15m
  releaseName: snapshot-controller
  interval: 1h
  values:
    controller:
      replicaCount: 1
