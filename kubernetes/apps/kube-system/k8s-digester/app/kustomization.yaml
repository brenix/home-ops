---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/google/k8s-digester/releases/download/v0.1.15/digester_manifest.yaml
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    group: apps
    version: v1
    kind: Deployment
    name: digester-controller-manager
- patch: |-
    - op: replace
      path: /webhooks/0/rules
      value:
        - apiGroups:
          - ""
          apiVersions:
          - v1
          operations:
          - CREATE
          - UPDATE
          resources:
          - pods
  target:
    group: admissionregistration.k8s.io
    version: v1
    kind: MutatingWebhookConfiguration
    name: digester-mutating-webhook-configuration
