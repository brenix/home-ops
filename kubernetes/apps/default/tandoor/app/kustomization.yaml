apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ./pvc-data.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: tandoor-configmap
    files:
      - ./resources/nginx.conf
generatorOptions:
  disableNameSuffixHash: true
