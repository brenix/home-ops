---
sonarr:
  series:
    base_url: http://sonarr.default.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    quality_definition:
      type: series
      preferred_ratio: 0
      qualities:
      - name: WEBDL-1080p
        max: 200
        preferred: 60
      - name: WEBRip-1080p
        max: 200
        preferred: 60
    quality_profiles:
    - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
      reset_unmatched_scores:
        enabled: true
    custom_formats:
    - # FLUX trumps REPACKS
      trash_ids:
      - 5d9fd1b1e06cd8a475462f40214b7df6 # FLUX
      assign_scores_to:
      - name: WEB-1080p
        score: 100
    - trash_ids:
      - 834e534f103938853ffced4203b53e72 # 2.0 Stereo
      assign_scores_to:
      - name: WEB-1080p
        score: 100
    - trash_ids:
      - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
      - 1bef6c151fa35093015b0bfef18279e5 # 2160p
      assign_scores_to:
      - name: WEB-1080p
        score: -1000
    - trash_ids:
      - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
      - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
      - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
      - 06d66ab109d4d2eddb2794d21526d140 # Retags
      assign_scores_to:
      - name: WEB-1080p

radarr:
  movies:
    base_url: http://radarr.default.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    quality_definition:
      type: movie
      preferred_ratio: 0
      qualities:
      - name: Bluray-1080p
        max: 200
        preferred: 60
