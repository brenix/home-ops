---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: unifi
    template:
      data:
        MONGO_USER: "{{ .MONGODB_USER }}"
        MONGO_PASS: "{{ .MONGODB_PASS }}"
  data:
  - secretKey: MONGODB_USER
    remoteRef:
      key: MONGODB_USER
  - secretKey: MONGODB_PASS
    remoteRef:
      key: MONGODB_PASS
