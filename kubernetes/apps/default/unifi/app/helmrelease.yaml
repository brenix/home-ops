---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi
spec:
  chartRef:
    kind: OCIRepository
    name: unifi
  interval: 1h
  values:
    controllers:
      unifi:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/unifi-network-application
              tag: 10.5.67@sha256:cb452744be875e091bad374999e90b08f34813d5bee03de814188de3d6eb5e99
            env:
              MONGO_DBNAME: unifi
              MONGO_HOST: mongodb.default.svc.cluster.local
              MONGO_PORT: 27017
              PGID: 1000
              PUID: 1000
              TZ: America/Los_Angeles
            envFrom:
            - secretRef:
                name: unifi
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 4Gi
        strategy: Recreate
    service:
      app:
        annotations:
          lbipam.cilium.io/ips: 192.168.2.2
        externalTrafficPolicy: Local
        ports:
          http:
            port: 8443
            protocol: HTTPS
            appProtocol: https
          controller:
            enabled: true
            port: 8080
            protocol: TCP
          portal-http:
            enabled: false
            port: 8880
            protocol: HTTP
          portal-https:
            enabled: false
            port: 8843
            protocol: HTTPS
          speedtest:
            enabled: true
            port: 6789
            protocol: TCP
          stun:
            enabled: true
            port: 3478
            protocol: UDP
          syslog:
            enabled: true
            port: 5514
            protocol: UDP
          discovery:
            enabled: true
            port: 10001
            protocol: UDP
        type: LoadBalancer
    route:
      app:
        hostnames:
        - "{{ .Release.Name }}.brenix.com"
        parentRefs:
        - name: envoy-internal
          namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}-data"
        globalMounts:
        - path: /config
