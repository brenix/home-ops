---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mumble
spec:
  chartRef:
    kind: OCIRepository
    name: mumble
  interval: 1h
  values:
    controllers:
      mumble:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mumble-voip/mumble-server
              tag: v1.6.870@sha256:5129662d9cbe0bc83bca152056cb9c337f592a2ad9e87fa0ea7844b4efb3d5b7
            env:
              MUMBLE_ACCEPT_UNKNOWN_SETTINGS: false
              MUMBLE_VERBOSE: false
              PUID: 1000
              PGID: 1000
            envFrom:
            - secretRef:
                name: "{{ .Release.Name }}"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
        strategy: Recreate
    service:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mumble.brenix.com
          external-dns.alpha.kubernetes.io/target: external.brenix.com
          lbipam.cilium.io/ips: 192.168.2.17
        externalTrafficPolicy: Local
        ports:
          mumble-tcp:
            enabled: true
            port: 64738
            primary: true
            protocol: TCP
          mumble-udp:
            enabled: true
            port: 64738
            protocol: UDP
        type: LoadBalancer
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}-data"
