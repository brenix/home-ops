---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb
spec:
  chartRef:
    kind: OCIRepository
    name: mongodb
  interval: 1h
  values:
    controllers:
      mongodb:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/mongo
              tag: 8.2.5@sha256:9e52bf8768ae4f59b9ca734845d15cee0e523ced14b900cc3692d241eec9154c
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
        type: statefulset
    service:
      app:
        ports:
          mongodb:
            enabled: true
            port: 27017
            primary: true
            protocol: TCP
        type: ClusterIP
    persistence:
      data:
        enabled: true
        existingClaim: "mongo-data"
        globalMounts:
        - path: /data/db
      initdb:
        enabled: true
        globalMounts:
        - path: /docker-entrypoint-initdb.d
        name: mongodb-init
        type: secret
