apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc-cache.yaml
configMapGenerator:
  - name: pacoloco-configmap
    files:
      - ./resources/pacoloco.yaml
generatorOptions:
  disableNameSuffixHash: true
