[env]
DIFF= "dyff between --omit-header --color on"
DOPPLER_CONFIG = "main"
DOPPLER_PROJECT = "home-ops"
JUST_UNSTABLE = "1"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/.private/age.key"
TALOSCONFIG = "{{config_root}}/talosconfig"

[tools]
age = "1.3"
cilium-cli = "0.19"
dyff = "latest"
flux2 = "2.8"
"github:mitsuhiko/minijinja" = "2.19"
gum = "0.17"
helm = "4"
helmfile = "1.4"
just = "1.50.0"
kubeconform = "0.7"
kustomize = "latest"
"pipx:flux-local" = "8.2"
pipx = "latest"
sops = "3.12"
stern = "1.33"
talos = "1.13.0"
task = "3.49"
velero = "1.18"
yamlfmt = "0.21"
yq = "4.53"
