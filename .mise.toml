[env]
DIFF= "dyff between --omit-header --color on"
DOPPLER_CONFIG = "main"
DOPPLER_PROJECT = "home-ops"
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/.private/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/.private/age.key"
TALOSCONFIG = "{{config_root}}/talosconfig"

[tools]
age = "1.3.1"
cilium-cli = "0.19.2"
dyff = "latest"
flux2 = "2.8.4"
"github:mitsuhiko/minijinja" = "2.19.0"
gum = "0.17.0"
helm = "4"
helmfile = "1.4.3"
just = "1.49.0"
kubeconform = "0.7.0"
kustomize = "latest"
"pipx:flux-local" = "8.2.0"
pipx = "latest"
sops = "3.12.2"
stern = "1.33.1"
talos = "1.12.6"
task = "3.49.1"
velero = "1.18.0"
yamlfmt = "0.21.0"
yq = "4.52.5"
