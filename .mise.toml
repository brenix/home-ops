[env]
DIFF= "dyff between --omit-header --color on"
DOPPLER_CONFIG = "main"
DOPPLER_PROJECT = "home-ops"
KUBECONFIG = "{{config_root}}/.private/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/.private/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
age = "1.3.1"
cilium-cli = "0.19.0"
dyff = "latest"
flux2 = "2.7.5"
"github:mitsuhiko/minijinja" = "2.13.0"
gum = "0.17.0"
helm = "4"
helmfile = "1.2.3"
just = "1.46.0"
kubeconform = "0.7.0"
kustomize = "latest"
"pipx:flux-local" = "8.1.0"
pipx = "latest"
sops = "3.11.0"
stern = "1.33.1"
talhelper = "3.1.2"
talos = "1.12.1"
task = "3.46.4"
velero = "1.17.2"
yamlfmt = "0.21.0"
yq = "4.50.1"
